# Docker Compose configuration for Project Niyati
# Provides PostgreSQL and Neo4j services for local development

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: niyati-postgres
    environment:
      POSTGRES_USER: niyati_user
      POSTGRES_PASSWORD: niyati_password
      POSTGRES_DB: niyati_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyati_user -d niyati_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: niyati-neo4j
    environment:
      NEO4J_AUTH: neo4j/niyati_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p niyati_password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
